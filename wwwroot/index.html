<title>MyAceEditor</title>
<style>
  /* Paleta neutra: preto/cinza + azul, texto branco. Layout: menu (topo) · árvore (esq.) · detalhes (dir.) */
  :root{
    /* claro (neutro cinza/azul) */
    --bg:#eef1f5; --panel:#ffffff; --panel-2:#e8ecf2; --line:#d4dae3; --line-soft:#e3e8ef;
    --fg:#121821; --muted:#5b6672; --accent:#2563eb; --accent-soft:#dbe6fb;
    --good:#2f8a55; --warn:#9a7b1f;
    --ic-npc:#2f6f9e; --ic-task:#6b7585; --ic-trg:#3b6fd6; --ic-res:#7c8aa0;
    --sans:"Inter",system-ui,-apple-system,Segoe UI,sans-serif;
    --disp:"Inter",system-ui,Segoe UI,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0e1116; --panel:#161b22; --panel-2:#1c232d; --line:#2b3340; --line-soft:#232a34;
    --fg:#eef2f8; --muted:#9aa4b2; --accent:#4f8ff7; --accent-soft:#17293f;
    --good:#3fa66a; --warn:#c9a23a;
    --ic-npc:#5b9bd5; --ic-task:#8792a3; --ic-trg:#4f8ff7; --ic-res:#9aa7bd; color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0e1116; --panel:#161b22; --panel-2:#1c232d; --line:#2b3340; --line-soft:#232a34;
    --fg:#eef2f8; --muted:#9aa4b2; --accent:#4f8ff7; --accent-soft:#17293f;
    --good:#3fa66a; --warn:#c9a23a;
    --ic-npc:#5b9bd5; --ic-task:#8792a3; --ic-trg:#4f8ff7; --ic-res:#9aa7bd; color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5}
  .app{display:flex;flex-direction:column;height:100%}
  button{font:inherit;color:inherit}

  /* BARRA DE MENU */
  .menubar{display:flex;align-items:center;gap:2px;background:var(--panel);border-bottom:1px solid var(--line);
    padding:0 8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:40;flex:none}
  .menubar .logo{font-family:var(--disp);font-weight:700;font-size:15px;padding:0 12px 0 6px;letter-spacing:.2px}
  .menubar .logo b{color:var(--accent)}
  .menu{position:relative}
  .menu>button{background:none;border:0;padding:9px 12px;cursor:pointer;border-radius:6px;font-size:13px}
  .menu>button:hover,.menu.open>button{background:var(--panel-2)}
  .dropdown{position:absolute;top:100%;left:0;min-width:216px;background:var(--panel);
    border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 34px rgba(0,0,0,.28);padding:5px;z-index:50}
  .dropdown button{display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;text-align:left;
    padding:7px 10px;border-radius:6px;cursor:pointer;font-size:13px}
  .dropdown button:hover{background:var(--accent-soft)}
  .dropdown button .sc{margin-left:auto;color:var(--muted);font-family:var(--mono);font-size:11px}
  .dropdown .sep{height:1px;background:var(--line-soft);margin:5px 2px}
  .menubar .grow{flex:1}
  .menubar .modname{color:var(--muted);font-family:var(--mono);font-size:12px;padding-right:6px}
  .conn{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);margin-right:8px}
  .conn.live{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
  .conn.demo{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}

  /* TOOLBAR */
  .toolbar{display:flex;align-items:center;gap:4px;background:var(--panel-2);border-bottom:1px solid var(--line);
    padding:5px 10px;flex:none}
  .tbtn{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);
    padding:6px 11px;border-radius:7px;cursor:pointer;font-size:13px}
  .tbtn:hover{border-color:var(--accent)}
  .tbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .tbtn svg{width:15px;height:15px}
  .toolbar .grow{flex:1}
  .toolbar .pending{display:inline-flex;gap:7px;align-items:center;font-size:12px;color:var(--muted)}
  .pend-dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
  .pend-dot.on{background:var(--accent)}

  /* CORPO */
  .body{flex:1;display:grid;grid-template-columns:300px 1fr;min-height:0}
  .tree{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-width:0}
  .tree .thead{padding:9px 14px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .tree .search{margin:8px;padding:7px 11px;border:1px solid var(--line);border-radius:7px;background:var(--panel-2);
    color:var(--fg);font:inherit}
  .tree .scroll{overflow:auto;flex:1;padding:4px 6px 14px}

  .grp{margin-top:6px}
  .grp>.grp-h{display:flex;align-items:center;gap:8px;padding:6px 8px;cursor:pointer;border-radius:7px;
    font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  .grp>.grp-h:hover{background:var(--panel-2)}
  .grp>.grp-h .caret{transition:transform .15s;font-size:10px}
  .grp.collapsed>.grp-h .caret{transform:rotate(-90deg)}
  .grp.collapsed>.grp-items{display:none}
  .grp-h .gcount{margin-left:auto;font-family:var(--mono);font-size:11px}

  .node{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:8px;cursor:pointer;margin:1px 0}
  .node:hover{background:var(--panel-2)}
  .node.active{background:var(--accent-soft)}
  .node .ico{width:26px;height:26px;border-radius:7px;flex:none;display:grid;place-items:center;color:#fff}
  .node .ico svg{width:15px;height:15px}
  .node .txt{min-width:0;flex:1}
  .node .txt .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .node .txt .ds{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .node .badge{font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:5px}
  .node .badge.new{background:color-mix(in srgb,var(--good) 24%,transparent);color:var(--good)}
  .node .badge.del{background:color-mix(in srgb,var(--accent) 24%,transparent);color:var(--accent)}

  /* DETALHES */
  .detail{min-width:0;overflow:auto;background:var(--bg)}
  .detail .empty{color:var(--muted);text-align:center;padding:72px 24px;font-style:italic}
  .dhead{display:flex;align-items:center;gap:14px;padding:20px 26px;border-bottom:1px solid var(--line);background:var(--panel)}
  .dhead .ico{width:46px;height:46px;border-radius:12px;flex:none;display:grid;place-items:center;color:#fff}
  .dhead .ico svg{width:24px;height:24px}
  .dhead h2{font-family:var(--disp);font-weight:700;margin:0;font-size:22px}
  .dhead .meta{color:var(--muted);font-family:var(--mono);font-size:12px;margin-top:2px}
  .dhead .meta b{color:var(--accent)}
  .dbody{padding:22px 26px;max-width:720px}
  .sect-t{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
  .fieldcard{display:grid;grid-template-columns:150px 94px 1fr;gap:10px;align-items:center;padding:10px 12px;
    border:1px solid var(--line-soft);border-radius:9px;margin-bottom:8px;background:var(--panel)}
  .fieldcard .k{font-weight:500}
  .fieldcard select,.fieldcard input{font:inherit;padding:6px 9px;border:1px solid var(--line);border-radius:6px;
    background:var(--panel-2);color:var(--fg);min-width:0;width:100%}
  .fieldcard select{font-family:var(--mono);font-size:12px}
  .fieldcard input.ref{font-family:var(--mono);color:var(--accent)}
  .refhint{font-size:11px;color:var(--muted);margin-top:-4px;margin-bottom:8px;padding-left:12px}
  .dactions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}

  /* STATUS + IA */
  .statusbar{display:flex;align-items:center;gap:10px;padding:7px 14px;border-top:1px solid var(--line);
    background:var(--panel);font-size:12px;color:var(--muted);flex:none;flex-wrap:wrap}
  .statusbar .ai{display:flex;gap:7px;align-items:center;flex:1;min-width:220px}
  .statusbar .ai .ico{width:20px;height:20px;border-radius:5px;background:var(--accent);color:#fff;
    display:grid;place-items:center;font-size:10px;font-weight:700;flex:none}
  .statusbar .ai input{flex:1;min-width:0;font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);
    border-radius:7px;background:var(--panel-2);color:var(--fg)}
  .statusbar .btn{background:var(--panel-2);border:1px solid var(--line);padding:6px 11px;border-radius:7px;cursor:pointer;font-size:12px}
  .statusbar .btn:hover{border-color:var(--accent)}
  .statusbar .btn.apply{background:var(--accent);border-color:var(--accent);color:#fff}
  .statusbar .btn:disabled{opacity:.4;cursor:not-allowed}

  @media (max-width:800px){
    .body{grid-template-columns:1fr;grid-auto-rows:minmax(0,auto)}
    .tree{border-right:0;border-bottom:1px solid var(--line);max-height:38vh}
    .menubar .modname{display:none}
  }
  .overlay{position:fixed;inset:0;z-index:30}
</style>

<div class="app">
  <nav class="menubar">
    <span class="logo">My<b>Ace</b>Editor</span>
    <div class="menu" data-menu="arquivo"><button>Arquivo</button>
      <div class="dropdown" hidden>
        <button data-act="novo">Novo módulo <span class="sc">Ctrl+N</span></button>
        <button data-act="abrir">Abrir… <span class="sc">Ctrl+O</span></button>
        <button data-act="abrir-pw">Abrir elements.data (Perfect World)…</button>
        <div class="sep"></div>
        <button data-act="salvar">Salvar <span class="sc">Ctrl+S</span></button>
        <button data-act="salvar-como">Salvar como…</button>
        <div class="sep"></div>
        <button data-act="exportar">Exportar JSON</button>
      </div>
    </div>
    <div class="menu" data-menu="editar"><button>Editar</button>
      <div class="dropdown" hidden>
        <button data-act="novo-item">Novo item <span class="sc">Ins</span></button>
        <button data-act="remover-item">Remover item selecionado</button>
        <div class="sep"></div>
        <button data-act="aplicar">Aplicar mudanças <span class="sc">Ctrl+Enter</span></button>
        <button data-act="descartar">Descartar mudanças</button>
      </div>
    </div>
    <div class="menu" data-menu="exibir"><button>Exibir</button>
      <div class="dropdown" hidden>
        <button data-act="expandir">Expandir tudo</button>
        <button data-act="recolher">Recolher tudo</button>
        <div class="sep"></div>
        <button data-act="tema">Alternar tema claro/escuro</button>
      </div>
    </div>
    <div class="menu" data-menu="config"><button>Configurações</button>
      <div class="dropdown" hidden>
        <button data-act="cfg-ia">Conexão com a IA…</button>
        <button data-act="cfg-caminhos">Caminhos do projeto…</button>
        <button data-act="cfg-sobre">Sobre o MyAceEditor</button>
      </div>
    </div>
    <span class="grow"></span>
    <span class="conn demo" id="conn">demo</span>
    <span class="modname" id="modName"></span>
  </nav>

  <div class="toolbar">
    <button class="tbtn" data-act="abrir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h5l2 2h11v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>Abrir</button>
    <button class="tbtn" data-act="salvar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M8 3v5h7"/></svg>Salvar</button>
    <button class="tbtn primary" data-act="novo-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Novo item</button>
    <span class="grow"></span>
    <span class="pending"><span class="pend-dot" id="pendDot"></span><span id="pendTxt">Sem mudanças</span></span>
  </div>

  <div class="body">
    <aside class="tree">
      <div class="thead">Conteúdo do arquivo</div>
      <input class="search" id="search" placeholder="Filtrar…">
      <div class="scroll" id="treePane"></div>
    </aside>
    <section class="detail" id="detailPane"></section>
  </div>

  <footer class="statusbar">
    <span id="statusText">Pronto</span>
    <div class="ai">
      <span class="ico">AI</span>
      <input id="aiInput" placeholder='Pedir à IA:  "crie um NPC Guardião com hp 100"'>
    </div>
    <button class="btn" id="discardBtn">Descartar</button>
    <button class="btn apply" id="applyBtn" disabled>Aplicar mudanças</button>
  </footer>

  <div id="pwModal" hidden style="position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:grid;place-items:center">
    <div style="background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(560px,92vw);box-shadow:0 18px 50px rgba(0,0,0,.4)">
      <h3 style="margin:0 0 4px;font-family:var(--disp)">Abrir elements.data</h3>
      <p style="margin:0 0 12px;color:var(--muted);font-size:12px">Caminho do arquivo <code>elements.data</code> do Perfect World (no servidor local).</p>
      <input id="pwPath" style="width:100%;font:inherit;font-family:var(--mono);font-size:12px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel-2);color:var(--fg)"
        value="D:/Perfect World/Perfect World 144/element/data/elements.data">
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
        <button class="btn" id="pwCancel">Cancelar</button>
        <button class="tbtn primary" id="pwOpen">Abrir</button>
      </div>
    </div>
  </div>
</div>

<script>
// Tema inicial: escuro neutro (preferência do usuário); o toggle continua disponível.
if(!document.documentElement.getAttribute("data-theme")) document.documentElement.setAttribute("data-theme","dark");

// ---------- dados de exemplo (fallback quando aberto como artefato, sem servidor) ----------
const DEMO = { name:"DemoWorld", version:1, path:"sample.data", lists:[
  {name:"NPCs", group:"Mundo", kind:"npc", items:[
    {id:"npc00001", name:"Sapo Ancião", fields:{hp:{type:"Int",value:"40"}, friendly:{type:"Bool",value:"true"}, dialogue:{type:"String",value:"Croac... bem-vindo, viajante."}}},
    {id:"npc00002", name:"Mercador Tico", fields:{hp:{type:"Int",value:"25"}, friendly:{type:"Bool",value:"true"}, gold:{type:"Int",value:"300"}}},
  ]},
  {name:"Tasks", group:"Quests", kind:"task", items:[
    {id:"task0001", name:"Encontrar o Sapo Ancião", fields:{target_npc:{type:"Reference",value:"npc00001"}, reward_gold:{type:"Int",value:"100"}}},
  ]},
  {name:"Triggers", group:"Lógica", kind:"trigger", items:[
    {id:"trg00001", name:"AoEntrarNoPantano", fields:{event:{type:"String",value:"on_area_enter"}, area:{type:"String",value:"pantano"}}},
  ]},
]};

const ICON={
  npc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
  task:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
  trigger:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h7l-1 8 10-12h-7z"/></svg>',
  res:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></svg>',
};
const ICOLOR={npc:"var(--ic-npc)",task:"var(--ic-task)",trigger:"var(--ic-trg)",res:"var(--ic-res)"};
const DESCR={
  npc:it=>`HP ${it.fields.hp?.value ?? "?"} · ${it.fields.friendly?.value==="true"?"amigável":"hostil"}`,
  task:it=>`recompensa ${it.fields.reward_gold?.value ?? 0} ouro`,
  trigger:it=>`evento: ${it.fields.event?.value ?? "?"}`,
};

let API=false;              // true = conectado ao servidor .NET; false = modo demo
let mod=structuredClone(DEMO);
const changeset=[];         // {op,label,dto,apply}
const staged={added:new Set(),removed:new Set()};
const collapsed=new Set();
let activeItem=null, activeList=null;

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kindOf=l=>l.kind||"res";

// ---------- conexão com o servidor ----------
async function boot(){
  try{
    const r=await fetch("/api/module",{cache:"no-store"});
    if(r.ok){ mod=await r.json(); API=true; setConn(true); status(`Conectado ao servidor · ${mod.path||""}`); }
    else throw 0;
  }catch{ API=false; setConn(false); mod=structuredClone(DEMO); status("Modo demonstração (sem servidor) — dados de exemplo"); }
  renderAll();
}
function setConn(live){ const c=$("#conn"); c.textContent=live?"servidor":"demo"; c.className="conn "+(live?"live":"demo"); }

// ---------- abrir elements.data (Perfect World) ----------
function openPwModal(){
  if(!API){ status("Disponível quando rodando pelo app local (servidor)"); return; }
  $("#pwModal").hidden=false; $("#pwPath").focus(); $("#pwPath").select();
}
$("#pwCancel").onclick=()=>{ $("#pwModal").hidden=true; };
$("#pwOpen").onclick=loadPw;
$("#pwPath").onkeydown=e=>{ if(e.key==="Enter")loadPw(); if(e.key==="Escape")$("#pwModal").hidden=true; };
async function loadPw(){
  const path=$("#pwPath").value.trim(); if(!path)return;
  $("#pwModal").hidden=true; status("Parseando elements.data…");
  try{
    const r=await fetch("/api/load-elements",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({path})});
    if(!r.ok){ const e=await r.json().catch(()=>({})); status("Erro: "+(e.error||r.status)); return; }
    const res=await r.json(); mod=res.module; activeItem=null; activeList=null; collapsed.clear();
    changeset.length=0; staged.added.clear(); staged.removed.clear(); syncPending(); renderAll();
    status(`Aberto: ${res.lists} listas · ${res.items.toLocaleString("pt-BR")} itens (1ª metade do elements.data)`);
  }catch(err){ status("Falha ao abrir: "+err.message); }
}

// ---------- MENU ----------
document.querySelectorAll(".menu").forEach(m=>m.querySelector("button").onclick=e=>{e.stopPropagation();toggleMenu(m);});
function closeMenus(){document.querySelectorAll(".menu.open").forEach(m=>{m.classList.remove("open");m.querySelector(".dropdown").hidden=true;});const ov=$("#ov");if(ov)ov.remove();}
function toggleMenu(m){const open=m.classList.contains("open");closeMenus();if(!open){m.classList.add("open");m.querySelector(".dropdown").hidden=false;const ov=document.createElement("div");ov.className="overlay";ov.id="ov";ov.onclick=closeMenus;document.body.appendChild(ov);}}
document.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();closeMenus();doAction(b.dataset.act);}));

async function doAction(a){
  switch(a){
    case "abrir": if(API){ await boot(); status("Recarregado do servidor"); } else status("Abrir: disponível quando rodando pelo servidor local"); break;
    case "abrir-pw": openPwModal(); break;
    case "salvar": await save(); break;
    case "salvar-como": status(API?"save_module_as: informe um caminho (próxima etapa)":"Disponível no servidor local"); break;
    case "novo": status("new_module: criaria um módulo vazio"); break;
    case "exportar": status("export_module_json: geraria o JSON do módulo"); break;
    case "novo-item": addItem(); break;
    case "remover-item": activeItem?removeItem(activeItem):status("Selecione um item primeiro"); break;
    case "aplicar": await applyChanges(); break;
    case "descartar": discardChanges(); break;
    case "expandir": collapsed.clear(); renderTree(); break;
    case "recolher": mod.lists.forEach(l=>collapsed.add(l.name)); renderTree(); break;
    case "tema": toggleTheme(); break;
    case "cfg-ia": status("Config → Conexão com a IA (endpoint/chave)"); break;
    case "cfg-caminhos": status("Config → Caminhos do projeto"); break;
    case "cfg-sobre": status("MyAceEditor · protótipo · servidor .NET + MCP"); break;
  }
}

// ---------- ÁRVORE ----------
function renderTree(){
  const q=$("#search").value.trim().toLowerCase();
  let html="";
  for(const l of mod.lists){
    const k=kindOf(l);
    const items=l.items.filter(i=>!q||i.name.toLowerCase().includes(q)||i.id.includes(q));
    if(q&&!items.length) continue;
    const isColl=collapsed.has(l.name)&&!q;
    html+=`<div class="grp ${isColl?'collapsed':''}" data-grp="${esc(l.name)}">
      <div class="grp-h"><span class="caret">▾</span>
        <span class="ico" style="width:18px;height:18px;border-radius:5px;background:${ICOLOR[k]}">${ICON[k]}</span>
        ${esc(l.name)}<span class="gcount">${l.items.length}</span></div><div class="grp-items">`;
    const CAP=400;
    const shown=items.slice(0,CAP);
    for(const it of shown){
      const isNew=staged.added.has(it.id), isDel=staged.removed.has(it.id);
      const ds=DESCR[k]?DESCR[k](it):(it.fields&&Object.keys(it.fields).length?`${Object.keys(it.fields).length} campos`:`id ${it.id}`);
      html+=`<div class="node ${it===activeItem?'active':''}" data-id="${esc(it.id)}" data-list="${esc(l.name)}">
        <span class="ico" style="background:${ICOLOR[k]}">${ICON[k]}</span>
        <span class="txt"><div class="nm">${esc(it.name||'(sem nome)')}</div><div class="ds">${esc(ds)}</div></span>
        ${isNew?'<span class="badge new">novo</span>':''}${isDel?'<span class="badge del">rem</span>':''}</div>`;
    }
    if(items.length>CAP) html+=`<div style="padding:6px 10px;color:var(--muted);font-size:11px">… e mais ${(items.length-CAP).toLocaleString("pt-BR")} itens (use o filtro)</div>`;
    html+=`</div></div>`;
  }
  $("#treePane").innerHTML=html||`<div style="padding:24px;color:var(--muted);text-align:center">Nada encontrado.</div>`;
  $("#treePane").querySelectorAll(".grp-h").forEach(h=>h.onclick=()=>{const n=h.parentElement.dataset.grp;collapsed.has(n)?collapsed.delete(n):collapsed.add(n);renderTree();});
  $("#treePane").querySelectorAll(".node").forEach(n=>n.onclick=()=>{activeList=mod.lists.find(l=>l.name===n.dataset.list);activeItem=activeList.items.find(i=>i.id===n.dataset.id);renderAll();});
}

// ---------- DETALHES ----------
function renderDetail(){
  if(!activeItem){ $("#detailPane").innerHTML=`<div class="empty">Selecione um item na árvore à esquerda para ver todas as informações.</div>`; return; }
  const k=kindOf(activeList), f=activeItem.fields, types=["String","Int","Float","Bool","Reference"];
  let fields="";
  for(const key in f){
    const opts=types.map(t=>`<option ${t===f[key].type?'selected':''}>${t}</option>`).join("");
    fields+=`<div class="fieldcard"><span class="k">${esc(key)}</span>
      <select data-f="${esc(key)}" data-kind="type">${opts}</select>
      <input data-f="${esc(key)}" data-kind="val" class="${f[key].type==='Reference'?'ref':''}" value="${esc(f[key].value)}"></div>`;
    if(f[key].type==="Reference"){const tgt=findItemById(f[key].value);fields+=`<div class="refhint">→ referência para ${tgt?esc(tgt.name):'(id não encontrado)'}</div>`;}
  }
  $("#detailPane").innerHTML=`
    <div class="dhead"><span class="ico" style="background:${ICOLOR[k]}">${ICON[k]}</span>
      <div><h2>${esc(activeItem.name)}</h2>
      <div class="meta">${esc(activeList.name)} · <b>${esc(activeItem.id)}</b> · ${Object.keys(f).length} campos</div></div></div>
    <div class="dbody"><p class="sect-t">Campos</p>
      ${fields||'<p style="color:var(--muted)">Sem campos. Adicione pela IA ou manualmente.</p>'}
      <div class="dactions">
        <button class="tbtn primary" id="setBtn">Salvar campos (preview)</button>
        <button class="tbtn" id="rmBtn">Remover item</button>
      </div></div>`;
  $("#setBtn").onclick=()=>{
    const changed={};
    $("#detailPane").querySelectorAll('[data-kind="val"]').forEach(inp=>{
      const key=inp.dataset.f, type=$(`#detailPane select[data-f="${CSS.escape(key)}"]`).value, val=inp.value;
      if(f[key].value!==val||f[key].type!==type) changed[key]={type,value:val};
    });
    const n=Object.keys(changed).length; if(!n){status("Nenhuma alteração");return;}
    stage("set",`set ${n} campo(s) em ${activeItem.id} (${activeList.name})`,
      {op:"set",list:activeList.name,id:activeItem.id,fields:changed},
      ()=>{for(const key in changed)activeItem.fields[key]=changed[key];});
    status(`Proposta: atualizar ${n} campo(s) de ${activeItem.name}`);
  };
  $("#rmBtn").onclick=()=>removeItem(activeItem);
}
function findItemById(id){for(const l of mod.lists){const it=l.items.find(i=>i.id===id);if(it)return it;}return null;}

// ---------- change set ----------
function stage(op,label,dto,applyFn){changeset.push({op,label,dto,apply:applyFn});syncPending();renderTree();}
function syncPending(){const n=changeset.length;$("#applyBtn").disabled=n===0;$("#pendDot").classList.toggle("on",n>0);$("#pendTxt").textContent=n?`${n} mudança(s) pendente(s)`:"Sem mudanças";}

function addItem(){
  if(!activeList) activeList=mod.lists[0];
  const id="new"+String(Math.floor(Math.random()*90000)+10000);
  const it={id,name:"Novo item",fields:{}}; staged.added.add(id); activeList.items.push(it); activeItem=it;
  stage("add",`add item 'Novo item' (${id}) em '${activeList.name}'`,
    {op:"add",list:activeList.name,id,name:"Novo item",fields:{}},()=>{});
  collapsed.delete(activeList.name); renderAll(); status(`Proposta: novo item em ${activeList.name}`);
}
function removeItem(it){
  const lst=mod.lists.find(l=>l.items.includes(it)); staged.removed.add(it.id);
  stage("rem",`remover item ${it.id} de '${lst.name}'`,
    {op:"rem",list:lst.name,id:it.id},()=>{lst.items=lst.items.filter(x=>x.id!==it.id);});
  status(`Proposta: remover ${it.name}`);
}

async function applyChanges(){
  if(!changeset.length) return;
  const n=changeset.length;
  if(API){
    try{
      const r=await fetch("/api/apply",{method:"POST",headers:{"content-type":"application/json"},
        body:JSON.stringify({changes:changeset.map(c=>c.dto)})});
      if(!r.ok) throw new Error(await r.text());
      const res=await r.json(); mod=res.module;
      changeset.length=0; staged.added.clear(); staged.removed.clear();
      if(activeItem && !findItemById(activeItem.id)) activeItem=null;
      syncPending(); renderAll(); status(`${res.applied} mudança(s) aplicada(s) e salvas em ${res.savedTo||mod.path}`);
    }catch(e){ status("Erro ao aplicar no servidor: "+e.message); }
  }else{
    changeset.forEach(c=>c.apply()); changeset.length=0; staged.added.clear(); staged.removed.clear();
    if(activeItem && !findItemById(activeItem.id)) activeItem=null;
    syncPending(); renderAll(); status(`${n} mudança(s) aplicada(s) (modo demo)`);
  }
}
function discardChanges(){
  mod.lists.forEach(l=>{l.items=l.items.filter(i=>!staged.added.has(i.id));});
  if(activeItem && staged.added.has(activeItem.id)) activeItem=null;
  changeset.length=0; staged.added.clear(); staged.removed.clear(); syncPending(); renderAll(); status("Mudanças descartadas");
}
async function save(){
  if(!API){ status("Salvar: disponível quando rodando pelo servidor local"); return; }
  try{ const r=await fetch("/api/save",{method:"POST",headers:{"content-type":"application/json"},body:"{}"});
    const res=await r.json(); status(`Salvo em ${res.savedTo}`); }
  catch(e){ status("Erro ao salvar: "+e.message); }
}
$("#applyBtn").onclick=applyChanges;
$("#discardBtn").onclick=discardChanges;

// ---------- IA ----------
$("#aiInput").onkeydown=e=>{if(e.key==="Enter")runAI();};
function runAI(){
  const t=$("#aiInput").value.trim(); if(!t)return;
  const hp=t.match(/hp\s*(\d+)/i);
  const nm=(t.match(/chamad[oa]\s+([A-Za-zÀ-ÿ]+)/i)||[])[1]||(/guardi/i.test(t)?"Guardião":"Novo NPC");
  activeList=mod.lists.find(l=>l.kind==="npc")||mod.lists[0];
  const id="ai"+String(Math.floor(Math.random()*90000)+10000);
  const fields=hp?{hp:{type:"Int",value:hp[1]}}:{};
  const it={id,name:nm,fields:structuredClone(fields)}; staged.added.add(id); activeList.items.push(it); activeItem=it;
  stage("add",`add item '${nm}' (${id}) em '${activeList.name}'`,{op:"add",list:activeList.name,id,name:nm,fields},()=>{});
  collapsed.delete(activeList.name); $("#aiInput").value=""; renderAll();
  status(`IA propôs: criar ${nm}${hp?` (hp ${hp[1]})`:''} — revise e aplique`);
}

// ---------- util ----------
function status(m){$("#statusText").textContent=m;}
function toggleTheme(){const cur=document.documentElement.getAttribute("data-theme");document.documentElement.setAttribute("data-theme",cur==="dark"?"light":"dark");}
document.addEventListener("keydown",e=>{
  if(e.ctrlKey&&e.key.toLowerCase()==="s"){e.preventDefault();save();}
  else if(e.ctrlKey&&e.key==="Enter"){e.preventDefault();applyChanges();}
  else if(e.key==="Insert"){addItem();}
});
$("#search").oninput=renderTree;

function renderAll(){ $("#modName").textContent=`${mod.name} · v${mod.version}${mod.path?" — "+mod.path:""}`; renderTree(); renderDetail(); syncPending(); }
boot();
</script>
