<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 800" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1560" height="800" fill="#14171c"/>
  <!-- janela principal -->
  <rect x="20" y="20" width="1190" height="760" rx="6" fill="#181b21" stroke="#465060"/>
  <text x="36" y="46" fill="#dfe5ee" font-size="15" font-weight="600">Mundo 3D · Mundo</text>
  <!-- mapa -->
  <rect x="32" y="60" width="850" height="676" fill="#3c4a3a"/>
  <path d="M32 60 H420 V300 L300 420 L32 380 Z" fill="#46603f"/>
  <path d="M420 60 H882 V260 L640 340 L420 300 Z" fill="#6b6a45"/>
  <path d="M32 380 L300 420 L360 736 H32 Z" fill="#3f5d6e"/>
  <path d="M300 420 L420 300 L640 340 L882 260 V736 H360 Z" fill="#54613f"/>
  <!-- zonas -->
  <g fill="#ffffff" fill-opacity="0.05" stroke="#d8dee8" stroke-opacity="0.55" stroke-width="1.5">
    <path d="M90 100 L330 90 L350 260 L140 300 Z"/>
    <path d="M360 110 L560 90 L600 240 L400 280 Z"/>
    <path d="M640 110 L840 130 L830 300 L660 290 Z"/>
    <path d="M90 450 L290 470 L320 690 L100 680 Z"/>
    <path d="M660 340 L850 330 L860 560 L690 590 Z"/>
  </g>
  <path d="M390 340 L520 320 L610 390 L640 500 L560 600 L420 590 L340 480 Z" fill="#4aa3ff" fill-opacity="0.28" stroke="#6db7ff" stroke-width="3"/>
  <path d="M430 400 L520 390 L550 470 L470 510 Z" fill="#00fffc" fill-opacity="0.18" stroke="#00fffc" stroke-width="2"/>
  <g fill="#fff" stroke="#1a6fd0" stroke-width="2">
    <circle cx="390" cy="340" r="6"/><circle cx="520" cy="320" r="6"/><circle cx="610" cy="390" r="6"/><circle cx="640" cy="500" r="6"/><circle cx="560" cy="600" r="6"/><circle cx="420" cy="590" r="6"/><circle cx="340" cy="480" r="6"/>
  </g>
  <g fill="#f4f7fb" font-size="13" text-anchor="middle">
    <text x="220" y="200">Vila da Avalanche</text><text x="480" y="190">Terra Gelada</text><text x="745" y="215">Cidade Congelada</text><text x="205" y="580">Porto das Névoas</text><text x="770" y="460">Colina Branca</text>
    <text x="495" y="552" font-size="15" font-weight="700">Bosque do Lobo</text><text x="490" y="456" fill="#00fffc">Vila Protegida</text>
  </g>
  <!-- renascer -->
  <circle cx="470" cy="360" r="11" fill="#ffc85a" stroke="#fff" stroke-width="2"/>
  <text x="470" y="365" font-size="13" text-anchor="middle" fill="#2a2000" font-weight="700">+</text>
  <!-- zoom -->
  <g>
    <rect x="46" y="74" width="44" height="134" rx="6" fill="#20242c" stroke="#465060"/>
    <text x="68" y="104" fill="#fff" font-size="24" text-anchor="middle">+</text>
    <text x="68" y="146" fill="#fff" font-size="24" text-anchor="middle">−</text>
    <text x="68" y="190" fill="#fff" font-size="12" text-anchor="middle">Tudo</text>
    <line x1="52" y1="118" x2="84" y2="118" stroke="#465060"/><line x1="52" y1="160" x2="84" y2="160" stroke="#465060"/>
  </g>
  <rect x="104" y="74" width="126" height="34" rx="6" fill="#20242c" stroke="#465060"/>
  <text x="167" y="96" fill="#fff" font-size="13" text-anchor="middle">Ver no chão</text>
  <g stroke="#fff" stroke-width="2"><line x1="760" y1="710" x2="860" y2="710"/><line x1="760" y1="704" x2="760" y2="716"/><line x1="860" y1="704" x2="860" y2="716"/></g>
  <text x="810" y="698" fill="#fff" font-size="12" text-anchor="middle">200 m</text>
  <!-- aqui o jogador vê -->
  <rect x="32" y="736" width="850" height="32" fill="#20242c"/>
  <text x="46" y="757" fill="#dfe5ee" font-size="13">Aqui o jogador vê: Bosque do Lobo · renasce em Vila Protegida · território Bosque · sem proteção</text>
  <!-- painel -->
  <rect x="890" y="60" width="308" height="708" fill="#20242c"/>
  <text x="904" y="88" fill="#fff" font-size="16" font-weight="600">←  Bosque do Lobo</text>
  <rect x="902" y="100" width="284" height="42" rx="6" fill="#2b3644"/>
  <circle cx="918" cy="121" r="6" fill="#58d68d"/>
  <text x="934" y="118" fill="#fff" font-size="12">Cliente e servidor combinam</text>
  <text x="934" y="134" fill="#a8b2c0" font-size="11">Mapa Mundo · 382 zonas</text>
  <g font-size="13" fill="#fff">
    <text x="904" y="170" font-weight="600">✓ 1  Nome</text>
    <rect x="922" y="178" width="264" height="28" fill="#2c323c" stroke="#465060"/><text x="932" y="197">Bosque do Lobo</text>
    <text x="904" y="232" font-weight="600">✓ 2  Área</text>
    <text x="922" y="252" fill="#a8b2c0" font-size="12">7 cantos · 300 m de largura</text>
    <rect x="922" y="260" width="128" height="26" rx="4" fill="#2c323c"/><text x="986" y="278" text-anchor="middle" font-size="12">Desenhar de novo</text>
    <rect x="1058" y="260" width="128" height="26" rx="4" fill="#2c323c"/><text x="1122" y="278" text-anchor="middle" font-size="12">Mais uma parte</text>
    <text x="904" y="312" font-weight="600">✓ 3  Música e som</text>
    <text x="922" y="332" font-size="12">▶ Floresta calma.mp3</text>
    <text x="922" y="350" fill="#a8b2c0" font-size="12">Repete sempre · som de dia e de noite</text>
    <text x="904" y="376" font-weight="600">✓ 4  Regras do lugar</text>
    <text x="922" y="396" font-size="12">Renasce em: Vila Protegida (no mapa)</text>
    <text x="922" y="414" font-size="12">Território: Bosque</text>
    <text x="922" y="432" font-size="12">☐ Novatos protegidos de PK</text>
    <text x="904" y="458" font-weight="600">5  Lugares no minimapa (opcional)</text>
    <text x="922" y="478" fill="#a8b2c0" font-size="12">Nenhum lugar marcado</text>
  </g>
  <rect x="902" y="496" width="284" height="152" rx="6" fill="#1b2a3a" stroke="#3a6ea5"/>
  <text x="914" y="518" fill="#fff" font-size="13" font-weight="600">Como vai ficar</text>
  <g fill="#dfe5ee" font-size="12">
    <text x="914" y="540">• Ao entrar, o jogador lê "Bosque do Lobo".</text>
    <text x="914" y="558">• A área muda: 7 cantos.</text>
    <text x="914" y="576">• Quem morre aqui renasce na Vila Protegida.</text>
    <text x="914" y="594">• Muda cliente e servidor. Depois do salvar,</text>
    <text x="926" y="610">reinicie o mapa e o jogo.</text>
    <text x="914" y="632" fill="#a8b2c0">Ctrl+Z desfaz até depois de salvar.</text>
  </g>
  <rect x="902" y="658" width="284" height="38" rx="6" fill="#1a6fd0"/>
  <text x="1044" y="682" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">Salvar zona</text>
  <text x="1044" y="722" fill="#e58a8a" font-size="13" text-anchor="middle">Excluir esta zona</text>
  <!-- lista -->
  <text x="1236" y="46" fill="#dfe5ee" font-size="15" font-weight="600">O mesmo painel, sem zona aberta</text>
  <rect x="1236" y="60" width="308" height="708" rx="4" fill="#20242c" stroke="#465060"/>
  <text x="1250" y="88" fill="#fff" font-size="16" font-weight="600">←  Zonas</text>
  <rect x="1248" y="100" width="284" height="42" rx="6" fill="#2b3644"/>
  <circle cx="1264" cy="121" r="6" fill="#58d68d"/>
  <text x="1280" y="118" fill="#fff" font-size="12">Cliente e servidor combinam</text>
  <text x="1280" y="134" fill="#a8b2c0" font-size="11">Mapa Mundo · 382 zonas</text>
  <rect x="1248" y="154" width="284" height="38" rx="6" fill="#1a6fd0"/>
  <text x="1390" y="178" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">+ Nova zona</text>
  <rect x="1248" y="204" width="284" height="30" fill="#2c323c" stroke="#465060"/>
  <text x="1260" y="224" fill="#a8b2c0" font-size="13">Procurar zona…</text>
  <g font-size="13" fill="#fff">
    <text x="1250" y="264" font-weight="600">Vila da Avalanche</text><text x="1250" y="282" fill="#a8b2c0" font-size="12">2 partes · território Neve</text>
    <text x="1250" y="316" font-weight="600">Terra Gelada</text><text x="1250" y="334" fill="#a8b2c0" font-size="12">5 partes</text>
    <text x="1250" y="368" font-weight="600" fill="#00fffc">Vila Protegida</text><text x="1250" y="386" fill="#a8b2c0" font-size="12">novatos protegidos</text>
    <text x="1250" y="420" font-weight="600">Bosque do Lobo</text><text x="1250" y="438" fill="#a8b2c0" font-size="12">território Bosque</text>
    <text x="1250" y="472" font-weight="600">Fechado</text><text x="1250" y="490" fill="#a8b2c0" font-size="12">não mostra nome ao jogador</text>
  </g>
  <text x="1250" y="540" fill="#a8b2c0" font-size="12">Clique numa zona no mapa ou aqui.</text>
  <text x="1250" y="558" fill="#a8b2c0" font-size="12">Roda do mouse aproxima.</text>
  <text x="1250" y="576" fill="#a8b2c0" font-size="12">Arrastar move o mapa.</text>
</svg>
